name: Feature request
description: Suggest something SlopeForge should do
title: 'Feature: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The analysis or course problem you wanted to solve.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Analysis methods (Janbu, Spencer, Morgenstern-Price, ...)
        - Slip surfaces (non-circular, block, ...)
        - Soils and water (anisotropy, seepage, undrained strength profiles, ...)
        - Loads (anchors, reinforcement, point loads, ...)
        - Drawing and editor
        - Export (PDF, JSON, links)
        - Interface
        - Documentation
  - type: input
    id: clause
    attributes:
      label: Relevant reference (paper, textbook, code), if any
