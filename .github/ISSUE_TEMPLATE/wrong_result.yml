name: Wrong result
description: A design value or check does not match IS 456, SP 16 or a hand calculation
title: 'Wrong result: '
labels: ['wrong result']
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful kind of report. Please give enough for the number to be reproduced.
  - type: textarea
    id: design
    attributes:
      label: Design
      description: Paste the link from the app's Share button, or the saved JSON.
    validations:
      required: true
  - type: dropdown
    id: element
    attributes:
      label: Element
      options:
        - Beam
        - Column
        - Slab
        - Footing
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Which step or value?
      placeholder: Tension reinforcement, shear strength τc, Table 26 coefficient, ...
    validations:
      required: true
  - type: input
    id: got
    attributes:
      label: What SlopeForge shows
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source of the expected value
      description: Clause or table of IS 456 / SP 16, a textbook example (author, edition, page), or your hand calculation.
    validations:
      required: true
