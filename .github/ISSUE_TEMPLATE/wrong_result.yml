name: Wrong result
description: A factor of safety, slice value or critical circle does not match a benchmark or a hand calculation
title: 'Wrong result: '
labels: ['wrong result']
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful kind of report. Please give enough for the number to be reproduced.
  - type: textarea
    id: section
    attributes:
      label: Section
      description: Paste the link from the app's Share link button, or the saved JSON.
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Method
      options:
        - Bishop simplified
        - Ordinary (Fellenius)
        - Both
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: Which value?
      placeholder: Critical F, weight of slice 7, Bishop iteration, sensitivity curve, ...
    validations:
      required: true
  - type: input
    id: got
    attributes:
      label: What SlopeForge shows
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source of the expected value
      description: A published benchmark (author, year, problem), a textbook example (author, edition, page), another program, or your hand calculation.
    validations:
      required: true
